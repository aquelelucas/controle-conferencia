<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>King - Conferência</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --blue: #1769aa;
      --blue-dark: #0f4f82;
      --blue-soft: #eef6ff;
      --green: #16803c;
      --green-soft: #ecfdf3;
      --red: #c62828;
      --red-soft: #fff1f2;
      --yellow: #f4b400;
      --shadow: 0 10px 30px rgba(17, 24, 39, .08);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(229, 231, 235, .9);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 3px;
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 4px #fff7d6;
    }

    .logo {
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .04em;
      color: #111827;
    }

    .subtitulo {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin: 7px 0 22px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 14px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      min-height: 52px;
      padding: 13px 42px 13px 14px;
      font-size: 16px;
      color: var(--text);
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      outline: none;
    }

    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 105, 170, .12);
    }

    button {
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease;
    }

    button:active { transform: scale(.985); }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .btn-iniciar {
      margin-top: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 7px 18px rgba(23, 105, 170, .22);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .conferente-atual {
      min-width: 0;
    }

    .conferente-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .conferente-nome {
      margin-top: 3px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-online {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22a447;
    }

    .contador-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      margin-bottom: 14px;
      background: var(--blue-soft);
      border: 1px solid #dceeff;
      border-radius: 15px;
    }

    .contador-label {
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
    }

    .contador-sub {
      margin-top: 3px;
      color: #7b8794;
      font-size: 11px;
    }

    .numero {
      color: var(--blue);
      font-size: 31px;
      line-height: 1;
      font-weight: 800;
    }

    .camera-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #111827;
      border: 1px solid #dbe2e8;
    }

    #reader {
      width: 100%;
      overflow: hidden;
    }

    #reader video {
      border-radius: 15px;
    }

    .camera-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 8px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .camera-icon {
      font-size: 15px;
    }

    .instrucao {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 10px 8px 0;
    }

    .status {
      padding: 13px 14px;
      margin-top: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.35;
    }

    .sucesso { background: var(--green-soft); color: var(--green); }
    .erro { background: var(--red-soft); color: var(--red); }
    .aviso { background: #fff8e1; color: #8a6500; }

    .ultimo {
      margin-top: 12px;
      padding: 15px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      text-align: center;
    }

    .ultimo-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .ultimo-pedido {
      color: var(--blue);
      font-size: 28px;
      font-weight: 800;
      margin-top: 5px;
      word-break: break-word;
    }

    .btn-parar {
      margin-top: 18px;
      color: #fff;
      background: #b4232a;
      box-shadow: 0 5px 14px rgba(180, 35, 42, .12);
    }

    .rodape {
      margin-top: 15px;
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
    }

    .oculto { display: none !important; }

    .carregando {
      text-align: center;
      color: var(--muted);
      padding: 15px;
    }

    @media (max-width: 380px) {
      .container { padding: 10px 9px 20px; }
      .card { padding: 16px; border-radius: 18px; }
      .numero { font-size: 28px; }
      .conferente-nome { max-width: 170px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="logo">KING</div>
      </div>
      <div class="subtitulo">Controle de Conferência</div>

      <div id="telaInicial">
        <div class="section-title">Iniciar conferência</div>

        <label class="field-label" for="conferente">Conferente</label>
        <select id="conferente">
          <option value="">Carregando...</option>
        </select>

        <button class="btn-iniciar" onclick="iniciarConferencia()">
          INICIAR CONFERÊNCIA
        </button>

        <div class="rodape">Selecione seu nome para começar</div>
      </div>

      <div id="telaConferencia" class="oculto">
        <div class="topbar">
          <div class="conferente-atual">
            <div class="conferente-label">Conferente</div>
            <div id="conferenteAtual" class="conferente-nome">-</div>
          </div>
          <div class="status-online">
            <span class="status-dot"></span>
            EM CONFERÊNCIA
          </div>
        </div>

        <div class="contador-card">
          <div>
            <div class="contador-label">Pedidos conferidos</div>
            <div class="contador-sub">Contagem de hoje</div>
          </div>
          <span id="contador" class="numero">0</span>
        </div>

        <div class="camera-title">
          <span class="camera-icon">▣</span>
          Leitura do código de barras
        </div>

        <div class="camera-wrapper">
          <div id="reader"></div>
        </div>

        <div class="instrucao">
          Aponte a câmera para o código de barras do pedido.
        </div>

        <div id="status" class="status oculto"></div>

        <div id="ultimo" class="ultimo oculto">
          <div class="ultimo-label">Último pedido registrado</div>
          <div id="ultimoPedido" class="ultimo-pedido"></div>
        </div>

        <button class="btn-parar" onclick="finalizarConferencia()">
          FINALIZAR CONFERÊNCIA
        </button>
      </div>
    </div>
  </div>

<script>
const URL_API = 'https://script.google.com/macros/s/AKfycbw35QaB2JHTZWeZOWP1QtRJSBa9lLt29JvJi23P4yfqjx0tav2innM_LkmpEy2OCaBu/exec';
const CHAVE = 'KING-CONFERENCIA-2026';

let conferente = '';
let scanner = null;
let processando = false;
let ultimoCodigo = '';
let ultimoMomento = 0;

function chaveContador() {
  const hoje = new Date().toISOString().substring(0, 10);
  return 'contador_' + hoje + '_' + conferente;
}

function obterContadorLocal() {
  return parseInt(localStorage.getItem(chaveContador()) || '0', 10);
}

function salvarContadorLocal(valor) {
  localStorage.setItem(chaveContador(), String(valor));
}

function atualizarTelaContador() {
  document.getElementById('contador').textContent = obterContadorLocal();
}

function carregarConferentes() {
  const callback = 'callbackConferentes_' + Date.now();

  window[callback] = function(dados) {
    try {
      if (!dados || !dados.sucesso) {
        throw new Error(dados && dados.erro ? dados.erro : 'Erro ao carregar conferentes.');
      }

      const select = document.getElementById('conferente');
      select.innerHTML = '<option value="">Selecione seu nome</option>';

      dados.conferentes.forEach(function(nome) {
        const option = document.createElement('option');
        option.value = nome;
        option.textContent = nome;
        select.appendChild(option);
      });
    } catch (erro) {
      mostrarStatus(erro.message, true);
    }

    removerScript(callback);
  };

  const script = document.createElement('script');
  script.src = URL_API + '?acao=conferentes&chave=' + encodeURIComponent(CHAVE) + '&callback=' + callback;
  script.onerror = function() {
    mostrarStatus('Não foi possível carregar os conferentes.', true);
    removerScript(callback);
  };
  document.body.appendChild(script);
}

function removerScript(nomeCallback) {
  const scripts = document.querySelectorAll('script');
  scripts.forEach(function(script) {
    if (script.src && script.src.includes(nomeCallback)) script.remove();
  });
  try { delete window[nomeCallback]; } catch (e) {}
}

carregarConferentes();

function iniciarConferencia() {
  const select = document.getElementById('conferente');

  if (!select.value) {
    alert('Selecione o seu nome.');
    return;
  }

  conferente = select.value;
  atualizarTelaContador();
  document.getElementById('conferenteAtual').textContent = conferente;
  document.getElementById('telaInicial').classList.add('oculto');
  document.getElementById('telaConferencia').classList.remove('oculto');
  iniciarCamera();
}

function iniciarCamera() {
  scanner = new Html5Qrcode('reader');

  const formatos = [
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E
  ];

  const configuracao = {
    fps: 10,
    formatsToSupport: formatos,
    qrbox: function(largura, altura) {
      const tamanho = Math.min(largura * 0.85, 350);
      return {
        width: tamanho,
        height: Math.min(tamanho * 0.45, altura * 0.7)
      };
    }
  };

  scanner.start(
    { facingMode: 'environment' },
    configuracao,
    quandoCodigoForLido,
    function() {}
  ).catch(function(erro) {
    mostrarStatus('Não foi possível abrir a câmera. Verifique se o navegador permitiu o acesso à câmera.', true);
    console.error(erro);
  });
}

function quandoCodigoForLido(codigo) {
  codigo = String(codigo).trim();
  if (!codigo) return;

  const agora = Date.now();
  if (codigo === ultimoCodigo && agora - ultimoMomento < 5000) return;

  ultimoCodigo = codigo;
  ultimoMomento = agora;
  registrarPedido(codigo);
}

function registrarPedido(pedido) {
  if (processando) return;

  processando = true;
  mostrarStatus('Registrando pedido ' + pedido + '...', false);

  const callback = 'callbackRegistro_' + Date.now();

  window[callback] = function(dados) {
    try {
      if (!dados || !dados.sucesso) {
        throw new Error(dados && dados.erro ? dados.erro : 'Não foi possível registrar o pedido.');
      }

      adicionarAoContador();
      document.getElementById('ultimo').classList.remove('oculto');
      document.getElementById('ultimoPedido').textContent = dados.pedido;
      mostrarStatus('✓ Pedido ' + dados.pedido + ' registrado!', false);
    } catch (erro) {
      mostrarStatus(erro.message, true);
    }

    processando = false;
    removerScript(callback);
  };

  const script = document.createElement('script');
  script.src = URL_API +
    '?acao=registrar' +
    '&chave=' + encodeURIComponent(CHAVE) +
    '&conferente=' + encodeURIComponent(conferente) +
    '&pedido=' + encodeURIComponent(pedido) +
    '&callback=' + callback;

  script.onerror = function() {
    processando = false;
    mostrarStatus('Erro de comunicação com o Google Sheets.', true);
    removerScript(callback);
  };

  document.body.appendChild(script);
}

function adicionarAoContador() {
  const novo = obterContadorLocal() + 1;
  salvarContadorLocal(novo);
  document.getElementById('contador').textContent = novo;
}

function finalizarConferencia() {
  if (!confirm('Deseja finalizar esta conferência?')) return;

  if (scanner) {
    scanner.stop().then(function() {
      scanner.clear();
      voltarInicio();
    }).catch(function() {
      voltarInicio();
    });
  } else {
    voltarInicio();
  }
}

function voltarInicio() {
  document.getElementById('telaConferencia').classList.add('oculto');
  document.getElementById('telaInicial').classList.remove('oculto');
  document.getElementById('reader').innerHTML = '';
  document.getElementById('status').classList.add('oculto');
  document.getElementById('ultimo').classList.add('oculto');
  document.getElementById('conferenteAtual').textContent = '-';

  scanner = null;
  conferente = '';
  ultimoCodigo = '';
  ultimoMomento = 0;
}

function mostrarStatus(mensagem, erro) {
  const status = document.getElementById('status');
  status.textContent = mensagem;
  status.classList.remove('oculto', 'erro', 'sucesso', 'aviso');
  status.classList.add(erro ? 'erro' : 'sucesso');
}
</script>
</body>
</html>
