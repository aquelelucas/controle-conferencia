<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f4f82">
<title>KING | Link Separadores</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#eef2f5;
  --card:#ffffff;
  --text:#18212b;
  --muted:#697586;
  --border:#e3e8ee;
  --blue:#1769aa;
  --blue-dark:#0f4f82;
  --blue-soft:#edf6ff;
  --green:#147a3a;
  --green-soft:#edf9f1;
  --red:#b4232a;
  --red-soft:#fff1f2;
  --yellow:#f4b400;
  --shadow:0 18px 45px rgba(18,38,63,.10);
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#f9fbfc 0,#f1f4f7 46%,#e9eef2 100%);
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:var(--text);
}

.container{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:18px 14px 28px;
}

.card{
  background:var(--card);
  border:1px solid rgba(227,232,238,.95);
  border-radius:26px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.header{
  padding:24px 24px 20px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#ffffff 0,#fbfcfd 100%);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.brand-mark{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 0 5px #fff7d6;
}

.logo{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:.075em;
}

.subtitulo{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin:8px 0 0;
}

.content{
  padding:22px 24px 24px;
}

.section-title{
  font-size:19px;
  font-weight:850;
  margin:0 0 15px;
}

.field-label,
.label{
  display:block;
  color:#586575;
  font-size:10px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.09em;
}

select{
  width:100%;
  min-height:54px;
  padding:13px 14px;
  border:1px solid #cfd7e0;
  border-radius:13px;
  background:#fff;
  color:var(--text);
  font:inherit;
  font-size:16px;
  outline:0;
}

select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,105,170,.12);
}

button{
  width:100%;
  min-height:52px;
  padding:14px 16px;
  border:0;
  border-radius:13px;
  font:inherit;
  font-size:14px;
  font-weight:850;
  letter-spacing:.02em;
  cursor:pointer;
  transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease;
}

button:active{
  transform:scale(.985);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn-primary{
  margin-top:13px;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  box-shadow:0 9px 22px rgba(23,105,170,.20);
}

.btn-danger{
  margin-top:16px;
  color:#fff;
  background:#b4232a;
  box-shadow:0 7px 16px rgba(180,35,42,.12);
}

.helper{
  margin-top:10px;
  text-align:center;
  color:#98a2af;
  font-size:11px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.atual{
  min-width:0;
}

.nome{
  margin-top:4px;
  font-size:17px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:10px;
  font-weight:850;
  white-space:nowrap;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22a447;
}

.contador-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:17px 18px;
  margin-bottom:18px;
  border:1px solid #d9eafd;
  border-radius:17px;
  background:var(--blue-soft);
}

.contador-label{
  color:#465362;
  font-size:13px;
  font-weight:800;
}

.contador-sub{
  margin-top:4px;
  color:#7d8895;
  font-size:11px;
}

.numero{
  color:var(--blue);
  font-size:34px;
  line-height:1;
  font-weight:900;
}

.camera-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.camera-title{
  color:#394554;
  font-size:13px;
  font-weight:850;
}

.camera-state{
  color:var(--green);
  font-size:10px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.camera-wrapper{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#101820;
  border:1px solid #d5dde5;
}

#reader{
  width:100%;
  overflow:hidden;
}

#reader video{
  display:block;
  width:100%!important;
  border-radius:17px;
}

.instrucao{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
  margin:10px 12px 0;
}

.status{
  padding:13px 14px;
  margin-top:14px;
  border-radius:13px;
  text-align:center;
  font-size:13px;
  font-weight:800;
  line-height:1.4;
}

.sucesso{
  background:var(--green-soft);
  color:var(--green);
}

.erro{
  background:var(--red-soft);
  color:var(--red);
}

.ultimo{
  margin-top:12px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#f8fafc;
  text-align:center;
}

.ultimo-label{
  color:var(--muted);
  font-size:10px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.ultimo-pedido{
  margin-top:5px;
  color:var(--blue);
  font-size:27px;
  font-weight:900;
  word-break:break-word;
}

.oculto{
  display:none!important;
}

@media(max-width:500px){
  .container{padding:8px 8px 18px}
  .header{padding:21px 18px 18px}
  .content{padding:18px 18px 20px}
  .card{border-radius:21px}
  .logo{font-size:26px}
  .topbar{align-items:flex-start}
}

@media(max-width:360px){
  .content{padding:16px 14px 18px}
  .header{padding:19px 14px 17px}
  .badge{font-size:9px;padding:7px 9px}
  .numero{font-size:31px}
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <header class="header">
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="logo">KING</div>
      </div>
      <div class="subtitulo">Link Separadores</div>
    </header>

    <main class="content">

      <section id="telaInicial">
        <div class="section-title">Entrar na conferência</div>

        <label class="field-label" for="separador">
          Separador
        </label>

        <select id="separador">
          <option value="">Carregando...</option>
        </select>

        <button
          id="btnEntrar"
          class="btn-primary"
          onclick="entrar()"
          disabled
        >
          ENTRAR
        </button>

        <div id="carregamento" class="helper">
          Carregando separadores...
        </div>
      </section>

      <section id="telaConferencia" class="oculto">

        <div class="topbar">
          <div class="atual">
            <div class="label">Separador</div>
            <div id="separadorAtual" class="nome">-</div>
          </div>

          <div class="badge">
            <span class="dot"></span>
            EM CONFERÊNCIA
          </div>
        </div>

        <div class="contador-card">
          <div>
            <div class="contador-label">
              Pedidos registrados
            </div>
            <div class="contador-sub">
              Contagem de hoje
            </div>
          </div>

          <span id="contador" class="numero">0</span>
        </div>

        <div class="camera-head">
          <div class="camera-title">
            Leitura do código de barras
          </div>
          <div class="camera-state">
            Câmera ativa
          </div>
        </div>

        <div class="camera-wrapper">
          <div id="reader"></div>
        </div>

        <div class="instrucao">
          Aponte a câmera para o código de barras do pedido.
        </div>

        <div id="status" class="status oculto"></div>

        <div id="ultimo" class="ultimo oculto">
          <div class="ultimo-label">
            Último pedido registrado
          </div>

          <div id="ultimoPedido" class="ultimo-pedido"></div>
        </div>

        <button
          class="btn-danger"
          onclick="finalizarConferencia()"
        >
          FINALIZAR
        </button>
      </section>

    </main>
  </div>
</div>

<script>
const URL_API='https://script.google.com/macros/s/AKfycbw35QaB2JHTZWeZOWP1QtRJSBa9lLt29JvJi23P4yfqjx0tav2innM_LkmpEy2OCaBu/exec';
const CHAVE='KING-CONFERENCIA-2026';

let separador='';
let scanner=null;
let processando=false;
let ultimoCodigo='';
let ultimoMomento=0;
let contadorAtual=0;

function mostrarStatus(mensagem,erro=false){
  const el=document.getElementById('status');
  el.textContent=mensagem;
  el.className='status '+(erro?'erro':'sucesso');
}

function ocultarStatus(){
  document.getElementById('status').className='status oculto';
}

function removerScript(callback){
  document.querySelectorAll('script').forEach(script=>{
    if(script.src&&script.src.includes(callback)){
      script.remove();
    }
  });

  try{
    delete window[callback];
  }catch(e){}
}

function chamarApi(parametros,sucesso,erro){
  const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  const script=document.createElement('script');
  let terminou=false;

  parametros={
    ...parametros,
    chave:CHAVE,
    callback:callback
  };

  const finalizarErro=mensagem=>{
    if(terminou)return;

    terminou=true;
    clearTimeout(timer);
    removerScript(callback);
    erro(new Error(mensagem));
  };

  const timer=setTimeout(()=>{
    finalizarErro(
      'Tempo esgotado ao comunicar com o Google Sheets.'
    );
  },12000);

  window[callback]=dados=>{
    if(terminou)return;

    terminou=true;
    clearTimeout(timer);
    removerScript(callback);
    sucesso(dados);
  };

  script.onerror=()=>{
    finalizarErro(
      'Erro de comunicação com o Google Sheets.'
    );
  };

  script.src=URL_API+'?'+
    new URLSearchParams(parametros).toString();

  document.body.appendChild(script);
}

function preencherSeparadores(lista){
  const select=document.getElementById('separador');

  const nomes=[
    ...new Set(
      (lista||[])
        .map(nome=>String(nome||'').trim())
        .filter(Boolean)
    )
  ];

  select.innerHTML=
    '<option value="">Selecione seu nome</option>';

  nomes.forEach(nome=>{
    const option=document.createElement('option');

    option.value=nome;
    option.textContent=nome;

    select.appendChild(option);
  });

  document.getElementById('btnEntrar').disabled=
    nomes.length===0;

  document.getElementById('carregamento').textContent=
    nomes.length
      ? 'Selecione seu nome e entre.'
      : 'Nenhum separador cadastrado.';
}

function carregarSeparadores(){
  const rodape=document.getElementById('carregamento');

  rodape.textContent='Carregando separadores...';
  rodape.style.cursor='default';
  rodape.onclick=null;

  chamarApi(
    {acao:'separadores'},
    dados=>{
      if(
        dados&&
        dados.sucesso&&
        Array.isArray(dados.separadores)
      ){
        preencherSeparadores(dados.separadores);
        return;
      }

      mostrarErroInicial(
        dados&&dados.erro
          ? dados.erro
          : 'Não foi possível carregar os separadores.'
      );
    },
    erro=>{
      mostrarErroInicial(erro.message);
    }
  );
}

function mostrarErroInicial(mensagem){
  const select=document.getElementById('separador');

  select.innerHTML=
    '<option value="">Erro ao carregar</option>';

  document.getElementById('btnEntrar').disabled=true;

  const rodape=document.getElementById('carregamento');

  rodape.textContent=
    mensagem+
    ' Clique aqui para tentar novamente.';

  rodape.style.cursor='pointer';
  rodape.onclick=carregarSeparadores;
}

carregarSeparadores();

function entrar(){
  const select=document.getElementById('separador');

  if(!select.value){
    alert('Selecione o seu nome.');
    return;
  }

  separador=select.value;
  contadorAtual=0;
  processando=false;
  ultimoCodigo='';
  ultimoMomento=0;

  document.getElementById('contador').textContent='0';
  document.getElementById('separadorAtual').textContent=separador;

  document.getElementById('telaInicial')
    .classList.add('oculto');

  document.getElementById('telaConferencia')
    .classList.remove('oculto');

  document.getElementById('ultimo')
    .classList.add('oculto');

  ocultarStatus();

  carregarQuantidade();
  iniciarCamera();
}

function carregarQuantidade(){
  chamarApi(
    {
      acao:'quantidade',
      separador:separador
    },
    dados=>{
      if(dados&&dados.sucesso){
        contadorAtual=Number(dados.quantidade||0);

        document.getElementById('contador').textContent=
          contadorAtual;
      }
    },
    ()=>{}
  );
}

function iniciarCamera(){
  if(scanner)return;

  if(typeof Html5Qrcode==='undefined'){
    mostrarStatus(
      'Leitor de código indisponível. Atualize a página.',
      true
    );
    return;
  }

  scanner=new Html5Qrcode('reader');

  const formatos=[
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E
  ];

  const config={
    fps:10,
    formatsToSupport:formatos,
    qrbox:(w,h)=>{
      const largura=Math.min(w*.84,350);

      return{
        width:largura,
        height:Math.min(largura*.45,h*.7)
      };
    }
  };

  scanner.start(
    {facingMode:'environment'},
    config,
    quandoCodigoForLido,
    ()=>{}
  ).catch(()=>{
    mostrarStatus(
      'Não foi possível abrir a câmera. Verifique a permissão do navegador.',
      true
    );
  });
}

function quandoCodigoForLido(codigo){
  codigo=String(codigo||'').trim();

  if(!codigo||processando)return;

  const agora=Date.now();

  if(
    codigo===ultimoCodigo&&
    agora-ultimoMomento<5000
  ){
    return;
  }

  ultimoCodigo=codigo;
  ultimoMomento=agora;

  registrarPedido(codigo);
}

function registrarPedido(pedido){
  if(processando)return;

  processando=true;

  mostrarStatus(
    'Registrando pedido '+pedido+'...',
    false
  );

  chamarApi(
    {
      acao:'registrar',
      pedido:pedido,
      separador:separador
    },
    dados=>{
      processando=false;

      if(!dados||!dados.sucesso){
        mostrarStatus(
          dados&&dados.erro
            ? dados.erro
            : 'Não foi possível registrar o pedido.',
          true
        );

        return;
      }

      contadorAtual++;

      document.getElementById('contador').textContent=
        contadorAtual;

      document.getElementById('ultimo')
        .classList.remove('oculto');

      document.getElementById('ultimoPedido').textContent=
        dados.pedido;

      mostrarStatus(
        '✓ Pedido '+dados.pedido+' registrado!',
        false
      );

      // A câmera permanece aberta e pronta para o próximo bip.
    },
    erro=>{
      processando=false;

      mostrarStatus(
        erro.message,
        true
      );
    }
  );
}

function finalizarConferencia(){
  const concluir=()=>{
    scanner=null;
    processando=false;
    separador='';
    ultimoCodigo='';
    ultimoMomento=0;

    document.getElementById('reader').innerHTML='';

    document.getElementById('telaConferencia')
      .classList.add('oculto');

    document.getElementById('telaInicial')
      .classList.remove('oculto');

    document.getElementById('ultimo')
      .classList.add('oculto');

    ocultarStatus();

    carregarSeparadores();
  };

  if(scanner){
    scanner.stop()
      .then(()=>{
        return scanner.clear();
      })
      .then(concluir)
      .catch(concluir);
  }else{
    concluir();
  }
}
</script>

</body>
</html>
