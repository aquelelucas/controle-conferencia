<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>King - Conferência</title>

  <!-- Leitor de código de barras -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #111;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    .btn-iniciar {
      background: #1976d2;
      color: white;
    }

    .btn-parar {
      background: #c62828;
      color: white;
    }

    .contador {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .numero {
      color: #1976d2;
      font-size: 30px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      margin-top: 10px;
    }

    .instrucao {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin: 10px 0;
    }

    .status {
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
    }

    .sucesso {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .erro {
      background: #ffebee;
      color: #c62828;
    }

    .aviso {
      background: #fff8e1;
      color: #8a6500;
    }

    .ultimo {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f8ff;
      text-align: center;
    }

    .ultimo-label {
      color: #666;
      font-size: 14px;
    }

    .ultimo-pedido {
      color: #1976d2;
      font-size: 32px;
      font-weight: bold;
      margin-top: 5px;
    }

    .oculto {
      display: none;
    }

    .carregando {
      text-align: center;
      color: #666;
      padding: 15px;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      KING
    </div>

    <div class="subtitulo">
      Controle de Conferência
    </div>


    <!-- ========================= -->
    <!-- TELA INICIAL              -->
    <!-- ========================= -->

    <div id="telaInicial">

      <label>
        Conferente
      </label>

      <select id="conferente">

        <option value="">
          Carregando...
        </option>

      </select>


      <button
        class="btn-iniciar"
        onclick="iniciarConferencia()"
      >
        INICIAR CONFERÊNCIA
      </button>

    </div>


    <!-- ========================= -->
    <!-- TELA DE CONFERÊNCIA       -->
    <!-- ========================= -->

    <div
      id="telaConferencia"
      class="oculto"
    >

      <div class="contador">

        Pedidos hoje:

        <span
          id="contador"
          class="numero"
        >
          0
        </span>

      </div>


      <!-- CÂMERA -->

      <div id="reader"></div>


      <div class="instrucao">

        Aponte a câmera para o código
        de barras do pedido.

      </div>


      <!-- STATUS -->

      <div
        id="status"
        class="status oculto"
      ></div>


      <!-- ÚLTIMO PEDIDO -->

      <div
        id="ultimo"
        class="ultimo oculto"
      >

        <div class="ultimo-label">
          Último pedido registrado
        </div>

        <div
          id="ultimoPedido"
          class="ultimo-pedido"
        >
        </div>

      </div>


      <button
        class="btn-parar"
        onclick="finalizarConferencia()"
      >
        FINALIZAR CONFERÊNCIA
      </button>

    </div>

  </div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */


const URL_API =
  'https://script.google.com/macros/s/AKfycbw35QaB2JHTZWeZOWP1QtRJSBa9lLt29JvJi23P4yfqjx0tav2innM_LkmpEy2OCaBu/exec';


const CHAVE =
  'KING-CONFERENCIA-2026';


/* =====================================================
   VARIÁVEIS
   ===================================================== */


let conferente = '';

let scanner = null;

let processando = false;

let ultimoCodigo = '';

let ultimoMomento = 0;


/* =====================================================
   CONTADOR LOCAL
   ===================================================== */

function chaveContador() {

  const hoje =
    new Date()
      .toISOString()
      .substring(0, 10);

  return (
    'contador_' +
    hoje +
    '_' +
    conferente
  );

}


function obterContadorLocal() {

  const chave =
    chaveContador();

  return parseInt(
    localStorage.getItem(chave) || '0',
    10
  );

}


function salvarContadorLocal(valor) {

  localStorage.setItem(
    chaveContador(),
    String(valor)
  );

}


function atualizarTelaContador() {

  document
    .getElementById('contador')
    .textContent =
    obterContadorLocal();

}


/* =====================================================
   CARREGAR CONFERENTES
   ===================================================== */

function carregarConferentes() {

  const callback =
    'callbackConferentes_' +
    Date.now();


  window[callback] =
    function(dados) {

      try {

        if (
          !dados ||
          !dados.sucesso
        ) {

          throw new Error(
            dados &&
            dados.erro
              ? dados.erro
              : 'Erro ao carregar conferentes.'
          );

        }


        const select =
          document.getElementById(
            'conferente'
          );


        select.innerHTML =
          '<option value="">Selecione seu nome</option>';


        dados.conferentes.forEach(
          function(nome) {

            const option =
              document.createElement(
                'option'
              );

            option.value = nome;

            option.textContent = nome;

            select.appendChild(
              option
            );

          }
        );


      } catch (erro) {

        mostrarStatus(
          erro.message,
          true
        );

      }


      removerScript(callback);

    };


  const script =
    document.createElement('script');


  script.src =
    URL_API +
    '?acao=conferentes' +
    '&chave=' +
    encodeURIComponent(CHAVE) +
    '&callback=' +
    callback;


  script.onerror =
    function() {

      mostrarStatus(
        'Não foi possível carregar os conferentes.',
        true
      );

      removerScript(callback);

    };


  document.body.appendChild(
    script
  );

}


function removerScript(nomeCallback) {

  const scripts =
    document.querySelectorAll(
      'script'
    );


  scripts.forEach(
    function(script) {

      if (
        script.src &&
        script.src.includes(
          nomeCallback
        )
      ) {

        script.remove();

      }

    }
  );


  try {
    delete window[nomeCallback];
  } catch (e) {}

}


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

carregarConferentes();


/* =====================================================
   INICIAR CONFERÊNCIA
   ===================================================== */

function iniciarConferencia() {

  const select =
    document.getElementById(
      'conferente'
    );


  if (!select.value) {

    alert(
      'Selecione o seu nome.'
    );

    return;

  }


  conferente =
    select.value;


  atualizarTelaContador();


  document
    .getElementById(
      'telaInicial'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'telaConferencia'
    )
    .classList.remove(
      'oculto'
    );


  iniciarCamera();

}


/* =====================================================
   CÂMERA
   ===================================================== */

function iniciarCamera() {

  scanner =
    new Html5Qrcode(
      'reader'
    );


  const formatos = [

    Html5QrcodeSupportedFormats.CODE_128,

    Html5QrcodeSupportedFormats.CODE_39,

    Html5QrcodeSupportedFormats.CODE_93,

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E

  ];


  const configuracao = {

    fps: 10,

    formatsToSupport: formatos,

    qrbox: function(
      largura,
      altura
    ) {

      const tamanho =
        Math.min(
          largura * 0.85,
          350
        );

      return {
        width: tamanho,
        height: Math.min(
          tamanho * 0.45,
          altura * 0.7
        )
      };

    }

  };


  scanner.start(

    {
      facingMode: 'environment'
    },

    configuracao,

    quandoCodigoForLido,

    function() {

      // Ignora tentativas
      // que ainda não encontraram código.

    }

  )

  .catch(
    function(erro) {

      mostrarStatus(
        'Não foi possível abrir a câmera. Verifique se o navegador permitiu o acesso à câmera.',
        true
      );

      console.error(
        erro
      );

    }
  );

}


/* =====================================================
   CÓDIGO DE BARRAS FOI LIDO
   ===================================================== */

function quandoCodigoForLido(
  codigo
) {

  codigo =
    String(codigo)
      .trim();


  if (!codigo) {
    return;
  }


  /*
   * Evita que a câmera registre
   * o mesmo pedido várias vezes
   * em sequência.
   */

  const agora =
    Date.now();


  if (

    codigo === ultimoCodigo &&

    agora - ultimoMomento < 5000

  ) {

    return;

  }


  ultimoCodigo =
    codigo;

  ultimoMomento =
    agora;


  registrarPedido(
    codigo
  );

}


/* =====================================================
   REGISTRAR PEDIDO
   ===================================================== */

function registrarPedido(
  pedido
) {

  if (processando) {
    return;
  }


  processando =
    true;


  mostrarStatus(
    'Registrando pedido ' +
    pedido +
    '...',
    false
  );


  const callback =
    'callbackRegistro_' +
    Date.now();


  window[callback] =
    function(dados) {

      try {

        if (
          !dados ||
          !dados.sucesso
        ) {

          throw new Error(
            dados &&
            dados.erro
              ? dados.erro
              : 'Não foi possível registrar o pedido.'
          );

        }


        /*
         * A API confirmou que o pedido
         * chegou ao Google Sheets.
         */

        adicionarAoContador();


        document
          .getElementById(
            'ultimo'
          )
          .classList.remove(
            'oculto'
          );


        document
          .getElementById(
            'ultimoPedido'
          )
          .textContent =
          dados.pedido;


        mostrarStatus(
          '✓ Pedido ' +
          dados.pedido +
          ' registrado!',
          false
        );


      } catch (erro) {

        mostrarStatus(
          erro.message,
          true
        );

      }


      processando =
        false;


      removerScript(
        callback
      );

    };


  /*
   * Chamada para o Google Apps Script
   */

  const script =
    document.createElement(
      'script'
    );


  script.src =

    URL_API +

    '?acao=registrar' +

    '&chave=' +
    encodeURIComponent(
      CHAVE
    ) +

    '&conferente=' +
    encodeURIComponent(
      conferente
    ) +

    '&pedido=' +
    encodeURIComponent(
      pedido
    ) +

    '&callback=' +
    callback;


  script.onerror =
    function() {

      processando =
        false;


      mostrarStatus(
        'Erro de comunicação com o Google Sheets.',
        true
      );


      removerScript(
        callback
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   AUMENTAR CONTADOR
   ===================================================== */

function adicionarAoContador() {

  const atual =
    obterContadorLocal();


  const novo =
    atual + 1;


  salvarContadorLocal(
    novo
  );


  document
    .getElementById(
      'contador'
    )
    .textContent =
    novo;

}


/* =====================================================
   FINALIZAR
   ===================================================== */

function finalizarConferencia() {

  if (!confirm(
    'Deseja finalizar esta conferência?'
  )) {

    return;

  }


  if (scanner) {

    scanner
      .stop()
      .then(
        function() {

          scanner.clear();

          voltarInicio();

        }
      )
      .catch(
        function() {

          voltarInicio();

        }
      );

  } else {

    voltarInicio();

  }

}


/* =====================================================
   VOLTAR PARA TELA INICIAL
   ===================================================== */

function voltarInicio() {

  document
    .getElementById(
      'telaConferencia'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'telaInicial'
    )
    .classList.remove(
      'oculto'
    );


  document
    .getElementById(
      'reader'
    )
    .innerHTML = '';


  document
    .getElementById(
      'status'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'ultimo'
    )
    .classList.add(
      'oculto'
    );


  scanner =
    null;

  conferente =
    '';

  ultimoCodigo =
    '';

  ultimoMomento =
    0;

}


/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarStatus(
  mensagem,
  erro
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    mensagem;


  status.classList.remove(
    'oculto',
    'erro',
    'sucesso',
    'aviso'
  );


  if (erro) {

    status.classList.add(
      'erro'
    );

  } else {

    status.classList.add(
      'sucesso'
    );

  }

}

</script>

</body>

</html>
