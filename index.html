<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>KING | Link Separadores</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f5f7;
  --card:#fff;
  --text:#17202a;
  --muted:#6b7280;
  --border:#e2e6eb;
  --blue:#1769aa;
  --blue-dark:#0f4f82;
  --blue-soft:#eef6ff;
  --green:#16803c;
  --green-soft:#ecfdf3;
  --red:#b4232a;
  --yellow:#f4b400;
  --shadow:0 18px 45px rgba(17,24,39,.10);
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#eef2f5 0,#f7f8fa 45%,#eef1f4 100%);
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:var(--text);
}

.container{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:22px 16px 32px;
}

.card{
  background:var(--card);
  border:1px solid rgba(226,230,235,.95);
  border-radius:24px;
  padding:24px;
  box-shadow:var(--shadow);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.brand-mark{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 0 5px #fff7d6;
}

.logo{
  font-size:28px;
  line-height:1;
  font-weight:850;
  letter-spacing:.07em;
}

.subtitulo{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:8px 0 25px;
}

.section-title{
  font-size:19px;
  font-weight:800;
  margin:0 0 16px;
}

.field-label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#374151;
  margin:0 0 7px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

select{
  width:100%;
  min-height:52px;
  padding:13px 14px;
  font-size:16px;
  color:var(--text);
  border:1px solid #d1d7de;
  border-radius:12px;
  background:#fff;
  outline:0;
  font-family:inherit;
}

select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,105,170,.12);
}

button{
  width:100%;
  min-height:52px;
  padding:14px 16px;
  border:0;
  border-radius:12px;
  font-size:14px;
  font-weight:850;
  letter-spacing:.02em;
  cursor:pointer;
  transition:transform .12s ease,opacity .12s ease,background .12s ease;
}

button:active{transform:scale(.985)}
button:disabled{opacity:.55;cursor:not-allowed}

.btn-primary{
  margin-top:14px;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  box-shadow:0 8px 20px rgba(23,105,170,.20);
}

.btn-danger{
  margin-top:18px;
  color:#fff;
  background:var(--red);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.atual{min-width:0}

.label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.09em;
  font-weight:800;
}

.nome{
  margin-top:4px;
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:var(--green-soft);
  color:var(--green);
  font-size:10px;
  font-weight:850;
  white-space:nowrap;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22a447;
}

.contador-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 17px;
  margin-bottom:18px;
  background:var(--blue-soft);
  border:1px solid #dceeff;
  border-radius:16px;
}

.contador-label{
  color:#4b5563;
  font-size:13px;
  font-weight:750;
}

.contador-sub{
  margin-top:3px;
  color:#7b8794;
  font-size:11px;
}

.numero{
  color:var(--blue);
  font-size:32px;
  line-height:1;
  font-weight:850;
}

.camera-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 8px;
  color:#374151;
  font-size:13px;
  font-weight:800;
}

.camera-wrapper{
  overflow:hidden;
  border-radius:17px;
  background:#111827;
  border:1px solid #dbe2e8;
}

#reader{
  width:100%;
  overflow:hidden;
}

#reader video{
  border-radius:16px;
}

.instrucao{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
  margin:10px 8px 0;
}

.status{
  padding:13px 14px;
  margin-top:14px;
  border-radius:12px;
  text-align:center;
  font-weight:750;
  font-size:13px;
  line-height:1.4;
}

.sucesso{
  background:var(--green-soft);
  color:var(--green);
}

.erro{
  background:#fff1f2;
  color:var(--red);
}

.rodape{
  margin-top:15px;
  text-align:center;
  color:#9ca3af;
  font-size:11px;
  line-height:1.4;
}

.ultimo{
  margin-top:12px;
  padding:15px;
  border-radius:14px;
  background:#f8fafc;
  border:1px solid var(--border);
  text-align:center;
}

.ultimo-label{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.ultimo-pedido{
  color:var(--blue);
  font-size:26px;
  font-weight:850;
  margin-top:5px;
  word-break:break-word;
}

.oculto{
  display:none!important;
}

@media(max-width:500px){
  .container{padding:10px 9px 22px}
  .card{padding:17px;border-radius:20px}
  .logo{font-size:26px}
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="brand">
      <span class="brand-mark"></span>
      <div class="logo">KING</div>
    </div>

    <div class="subtitulo">Link Separadores</div>

    <section id="telaInicial">
      <div class="section-title">Entrar na conferência</div>

      <label class="field-label" for="separador">
        Separador
      </label>

      <select id="separador">
        <option value="">Carregando...</option>
      </select>

      <button
        id="btnEntrar"
        class="btn-primary"
        onclick="entrar()"
        disabled
      >
        ENTRAR
      </button>

      <div id="carregamento" class="rodape">
        Carregando separadores...
      </div>
    </section>

    <section id="telaConferencia" class="oculto">

      <div class="topbar">
        <div class="atual">
          <div class="label">Separador</div>
          <div id="separadorAtual" class="nome">-</div>
        </div>

        <div class="badge">
          <span class="dot"></span>
          EM CONFERÊNCIA
        </div>
      </div>

      <div class="contador-card">
        <div>
          <div class="contador-label">Pedidos registrados</div>
          <div class="contador-sub">Contagem de hoje</div>
        </div>
        <span id="contador" class="numero">0</span>
      </div>

      <div class="camera-title">
        <span>▣</span>
        Leitura do código de barras
      </div>

      <div class="camera-wrapper">
        <div id="reader"></div>
      </div>

      <div class="instrucao">
        Aponte a câmera para o código de barras do pedido.
      </div>

      <div id="status" class="status oculto"></div>

      <div id="ultimo" class="ultimo oculto">
        <div class="ultimo-label">
          Último pedido registrado
        </div>

        <div id="ultimoPedido" class="ultimo-pedido"></div>
      </div>

      <button
        class="btn-danger"
        onclick="finalizarConferencia()"
      >
        FINALIZAR
      </button>
    </section>
  </div>
</div>

<script>
const URL_API='https://script.google.com/macros/s/AKfycbw35QaB2JHTZWeZOWP1QtRJSBa9lLt29JvJi23P4yfqjx0tav2innM_LkmpEy2OCaBu/exec';
const CHAVE='KING-CONFERENCIA-2026';

let separador='';
let scanner=null;
let processando=false;
let ultimoCodigo='';
let ultimoMomento=0;
let contadorAtual=0;

function mostrarStatus(mensagem, erro=false){
  const el=document.getElementById('status');
  el.textContent=mensagem;
  el.className='status '+(erro?'erro':'sucesso');
}

function ocultarStatus(){
  document.getElementById('status').className='status oculto';
}

function removerScript(callback){
  document.querySelectorAll('script').forEach(script=>{
    if(script.src&&script.src.includes(callback)){
      script.remove();
    }
  });

  try{
    delete window[callback];
  }catch(e){}
}

function chamarApi(parametros, sucesso, erro){
  const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  const script=document.createElement('script');
  let terminou=false;

  parametros={
    ...parametros,
    chave:CHAVE,
    callback:callback
  };

  const finalizarErro=mensagem=>{
    if(terminou)return;

    terminou=true;
    clearTimeout(timer);
    removerScript(callback);
    erro(new Error(mensagem));
  };

  const timer=setTimeout(()=>{
    finalizarErro(
      'Tempo esgotado ao comunicar com o Google Sheets.'
    );
  },12000);

  window[callback]=dados=>{
    if(terminou)return;

    terminou=true;
    clearTimeout(timer);
    removerScript(callback);
    sucesso(dados);
  };

  script.onerror=()=>{
    finalizarErro(
      'Erro de comunicação com o Google Sheets.'
    );
  };

  script.src=URL_API+'?'+
    new URLSearchParams(parametros).toString();

  document.body.appendChild(script);
}

function carregarSeparadores(){
  document.getElementById('carregamento').textContent=
    'Carregando separadores...';

  chamarApi(
    {acao:'separadores'},
    dados=>{
      if(
        !dados ||
        !dados.sucesso ||
        !Array.isArray(dados.separadores)
      ){
        mostrarErroInicial(
          dados&&dados.erro
            ? dados.erro
            : 'Não foi possível carregar os separadores.'
        );
        return;
      }

      const select=document.getElementById('separador');

      select.innerHTML=
        '<option value="">Selecione seu nome</option>';

      const nomes=[
        ...new Set(
          dados.separadores
            .map(nome=>String(nome||'').trim())
            .filter(Boolean)
        )
      ];

      nomes.forEach(nome=>{
        const option=document.createElement('option');
        option.value=nome;
        option.textContent=nome;
        select.appendChild(option);
      });

      document.getElementById('btnEntrar').disabled=
        nomes.length===0;

      document.getElementById('carregamento').textContent=
        nomes.length
          ? 'Selecione seu nome e entre.'
          : 'Nenhum separador cadastrado.';
    },
    erro=>{
      mostrarErroInicial(erro.message);
    }
  );
}

function mostrarErroInicial(mensagem){
  const select=document.getElementById('separador');

  select.innerHTML=
    '<option value="">Erro ao carregar</option>';

  document.getElementById('btnEntrar').disabled=true;

  const rodape=document.getElementById('carregamento');

  rodape.textContent=
    mensagem+
    ' Clique aqui para tentar novamente.';

  rodape.style.cursor='pointer';
  rodape.onclick=carregarSeparadores;
}

carregarSeparadores();

function entrar(){
  const select=document.getElementById('separador');

  if(!select.value){
    alert('Selecione o seu nome.');
    return;
  }

  separador=select.value;
  contadorAtual=0;
  processando=false;
  ultimoCodigo='';
  ultimoMomento=0;

  document.getElementById('contador').textContent='0';
  document.getElementById('separadorAtual').textContent=separador;

  document.getElementById('telaInicial')
    .classList.add('oculto');

  document.getElementById('telaConferencia')
    .classList.remove('oculto');

  document.getElementById('ultimo')
    .classList.add('oculto');

  ocultarStatus();

  carregarQuantidade();
  iniciarCamera();
}

function carregarQuantidade(){
  chamarApi(
    {
      acao:'quantidade',
      separador:separador
    },
    dados=>{
      if(dados&&dados.sucesso){
        contadorAtual=Number(dados.quantidade||0);
        document.getElementById('contador').textContent=
          contadorAtual;
      }
    },
    ()=>{}
  );
}

function iniciarCamera(){
  if(scanner)return;

  if(typeof Html5Qrcode==='undefined'){
    mostrarStatus(
      'Leitor de código indisponível. Atualize a página.',
      true
    );
    return;
  }

  scanner=new Html5Qrcode('reader');

  const formatos=[
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E
  ];

  const config={
    fps:10,
    formatsToSupport:formatos,
    qrbox:(w,h)=>{
      const largura=Math.min(w*.85,350);

      return{
        width:largura,
        height:Math.min(largura*.45,h*.7)
      };
    }
  };

  scanner.start(
    {facingMode:'environment'},
    config,
    quandoCodigoForLido,
    ()=>{}
  ).catch(()=>{
    mostrarStatus(
      'Não foi possível abrir a câmera. Verifique a permissão do navegador.',
      true
    );
  });
}

function quandoCodigoForLido(codigo){
  codigo=String(codigo||'').trim();

  if(!codigo||processando)return;

  const agora=Date.now();

  if(
    codigo===ultimoCodigo &&
    agora-ultimoMomento<5000
  ){
    return;
  }

  ultimoCodigo=codigo;
  ultimoMomento=agora;

  registrarPedido(codigo);
}

function registrarPedido(pedido){
  if(processando)return;

  processando=true;

  mostrarStatus(
    'Registrando pedido '+pedido+'...',
    false
  );

  chamarApi(
    {
      acao:'registrar',
      pedido:pedido,
      separador:separador
    },
    dados=>{
      processando=false;

      if(!dados||!dados.sucesso){
        mostrarStatus(
          dados&&dados.erro
            ? dados.erro
            : 'Não foi possível registrar o pedido.',
          true
        );

        return;
      }

      contadorAtual++;
      document.getElementById('contador').textContent=
        contadorAtual;

      document.getElementById('ultimo')
        .classList.remove('oculto');

      document.getElementById('ultimoPedido').textContent=
        dados.pedido;

      mostrarStatus(
        '✓ Pedido '+dados.pedido+' registrado!',
        false
      );

      /*
       * Não fechamos a câmera.
       * Depois de registrar, ela fica imediatamente
       * pronta para o próximo bip.
       */
    },
    erro=>{
      processando=false;

      mostrarStatus(
        erro.message,
        true
      );
    }
  );
}

function finalizarConferencia(){
  const concluir=()=>{
    scanner=null;
    processando=false;
    separador='';
    ultimoCodigo='';
    ultimoMomento=0;

    document.getElementById('reader').innerHTML='';

    document.getElementById('telaConferencia')
      .classList.add('oculto');

    document.getElementById('telaInicial')
      .classList.remove('oculto');

    document.getElementById('ultimo')
      .classList.add('oculto');

    ocultarStatus();

    carregarSeparadores();
  };

  if(scanner){
    scanner.stop()
      .then(()=>{
        return scanner.clear();
      })
      .then(concluir)
      .catch(concluir);
  }else{
    concluir();
  }
}
</script>

</body>
</html>
